name: converge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  converge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Unit tests
        run: uv run --frozen pytest

      - name: Converge
        run: uv run --frozen mayhem setup --profile base --yes

      - name: Converge again, expecting no changes
        run: uv run --frozen mayhem setup --profile base --yes --expect-no-changes

      - name: Doctor
        run: uv run --frozen mayhem doctor

      - name: Upload module logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}
          path: ~/.mayhem/logs

  gitleaks:
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs a paid license on org repos.
      - name: Scan history
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$name" "$base/$name"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $name\$" | sha256sum -c -
          tar -xzf "$name" gitleaks
          ./gitleaks git --redact --verbose .
